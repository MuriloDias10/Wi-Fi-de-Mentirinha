            <nav class="menu-principal">

                    <li><a class="menu-link" href="./compra.html">Comprar Produtos</a></li>

                    <article class="roteador-card">
                        <img class="imagem" src="../img/natal.png" alt="Roteador de Natal">
                        <p class="roteador-tittle">Roteador de Natal</p>
                        <button class="roteador-text">R$120,00</button>
                    </article>

                    <article class="roteador-card">
                        <img class="imagem" src="../img/vaso-de-flor.png" alt="Roteador de Vaso de Flor">

                    <article class="roteador-card">
