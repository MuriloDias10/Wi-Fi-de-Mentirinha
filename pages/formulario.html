<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoFy</title>
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/style-formulario.css">
</head>

<body>
    <header class="cabecalho">
        <div class="container">

            <div align="center"> <img src="../img/Logo NoFy Dourado em Fundo Grafite.png" alt="Logo" width="600"> </div>

            <nav class="menu-principal">
                <ul class="menu-lista">
                    <li><a class="menu-link" href="../index.html">Início</a></li>
                    <li><a class="menu-link" href="./compra.html">Comprar Produtos</a></li>
                    <li><a class="menu-link" href="./formulario.html">Concorra a um roteador</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="container">
        <section class="secao">
            <h2 class="titulo-secao">Preencha o formulario para concorrer a um roteador gratis!</h2>

            <form class="formulario" action="#" method="post">
                <fieldset>
                    <legend>Identificação</legend>

                    <div class="campo-formulario">
                        <label for="none">Nome Completo:</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome Completo" minlength="3"
                            maxlength="80" required>

                    </div>
                    <div class="campo-formulario">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" placeholder="email@exemplo.com.br" required>
                    </div>
                    <div class="campo-formulario">
                        <label for="telefone">Telefone:</label>
                        <input type="tel" name="telefone" id="telefone">
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Preferências</legend>

                    <div class="campo-formulario">
                        <label for="data">Data preferida para entrega:</label>
                        <input type="date" id="data" name="data">
                    </div>

                    <div class="campo-formulario">
                        <label for="horario">Horario preferido:</label>
                        <input type="time" name="horario" id="horario">
                    </div>

                    <div class="campo-formulario">
                        <label for="urgencia">O quanto você deseja nosso produto?</label>
                        <input type="range" id="urgencia" name="urgencia" min="1" max="10" value="5">
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Mensagem</legend>

                    <div class="campo-formulario">
                        <label for="mensagem">Escreva por que você merece ser sorteado e informe seu endereço
                            completo:</label>
                        <textarea name="mensagem" id="mensagem" rows="8" minlength="10" maxlength="1000"
                            placeholder="Digite aqui..." required></textarea>
                    </div>
                </fieldset>
                <div class="acoes-formulario">
                    <button type="submit">Enviar</button>
                    <button type="reset">Limpar</button>
                </div>
            </form>
        </section>
    </main>
    <footer class="rodape">

</body>

</html>
